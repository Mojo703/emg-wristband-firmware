# WaveFormer (Rust/candle) — faithful re-implementation of the supervised
# classification path of arXiv:2506.11168 (github.com/ForeverBlue816/WaveFormer),
# as the accuracy-ceiling baseline for the EMG wristband. Empty [workspace] so
# cargo treats this as its own root (matches the repo's two-project convention).
[workspace]

[package]
name = "waveformer"
version = "0.1.0"
edition = "2021"

[dependencies]
candle-core = "0.10"
candle-nn = "0.10"
ndarray = "0.16"
ndarray-npy = "0.9"
rand = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[features]
# Opt into CUDA with `--features cuda` (matches emg-gesture-class). CPU by default
# so the architecture builds anywhere; training will want the GPU.
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[profile.release]
opt-level = 3
lto = "thin"
