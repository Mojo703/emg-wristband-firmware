# EMG wristband dashboard — axum backend that relays CBOR frames between connected
# devices and the Svelte frontend. Devices dial in over a WebSocket or are read from
# a serial port; the backend forwards each device's stream to the browsers viewing it
# and forwards browser control frames back. Host-only dev tool, no model of its own.
# Empty [workspace] per repo convention. Serves the built frontend from web/dist.
[workspace]

[package]
name = "dashboard"
version = "0.1.0"
edition = "2021"

[dependencies]
protocol = { path = "../protocol" }

axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tokio-serial = "5.4"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"

ciborium = "0.2"
anyhow = "1"
if-addrs = "0.15.0"

# Collection sessions: session.json manifest and the events.jsonl label log.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Session directory names use local civil time per the interfaces.rs layout doc.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
