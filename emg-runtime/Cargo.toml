# Empty workspace table makes this a workspace root so cargo doesn't attach it
# to an unrelated Cargo.toml higher up the directory tree.
[workspace]

[package]
name = "emg-runtime"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.77"
description = "On-device EMG gesture inference (int8 + ESP32-S3 SIMD) and the reject pipeline"

[features]
esp32s3-tests = ["dep:esp-idf-svc"]

[[example]]
name = "esp32s3-tests"
path = "examples/esp32s3-tests.rs"
required-features = ["esp32s3-tests"]

# no_std + alloc, no esp dependencies: pure compute plus the model-free decision
# spine. Builds on the host (scalar kernels) for verification and on Xtensa (SIMD
# kernels) when pulled in by a firmware crate, which supplies the esp toolchain.
[dependencies]
protocol = { path = "../protocol" }
# Float math (expf for the softmax) without std, which no_std forbids.
libm = "0.2"
# IEEE half, for the two-byte calibration row payload. no_std: no default features.
# 2.5 raised its MSRV to 1.81; keep this crate's declared Rust 1.77 floor.
half = { version = "=2.4.1", default-features = false }

# Speed, not size: this is the compute the firmware's latency budget rides on.
[profile.release]
opt-level = 3

[dev-dependencies]
ciborium = "0.2"
serde_json = "1.0.151"

[target.'cfg(all(target_arch = "xtensa", target_os = "espidf"))'.dependencies]
esp-idf-svc = { version = "0.52", optional = true }

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }
