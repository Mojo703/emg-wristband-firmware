[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor --partition-table partitions.csv"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort", "test"]

[env]
MCU = "esp32s3"
ESP_IDF_VERSION = "v5.2.2"

[alias]
test-device = [
    "test",
    "--release",
    "--example",
    "esp32s3-tests",
    "--features",
    "esp32s3-tests",
    "--target",
    "xtensa-esp32s3-espidf",
]
