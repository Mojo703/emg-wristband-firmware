# Empty workspace table makes this a workspace root so cargo doesn't attach it
# to an unrelated Cargo.toml higher up the directory tree.
[workspace]

[package]
name = "opal-firmware"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.77"
description = "ESP32-S3 EMG wristband device: fake provider → int8 inference → reject pipeline, streamed to the dashboard over wifi or serial"

# The default test harness stays on (the esp template disables it): `cargo test`
# runs on the device via the espflash runner. See src/link_policy.rs for the
# invocation.
[[bin]]
name = "opal-firmware"

# One binary, two roles. `playback` adds the firmware validation bench: when ADC
# bring-up fails — which is what a bare ESP32-S3 with no front end always does —
# the serve loop starts the playback engine instead of running without EMG, and
# a host tool streams recorded sessions in over the serial link. On a wired
# board bring-up succeeds and the feature changes nothing about the run, so the
# same image can be flashed to either. See `firmware-bench/PROTOCOL.md`.
[features]
playback = []

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1
debug = true

[dependencies]
emg-runtime = { path = "../emg-runtime" }
calibration-flow = { path = "../calibration-flow" }
feedback-vocabulary = { path = "../feedback-vocabulary" }
protocol = { path = "../protocol" }
# Default features are the crate's own bench binary and its esp-idf-svc/log/anyhow
# dependencies; the driver itself is no_std over embedded-hal and wants none of them.
drv2605l = { path = "../drv2605l", default-features = false }
embedded-hal = "1"
esp-idf-svc = "0.52"
# Only for naming esp-idf-svc's config-string error type; keep in lockstep with it.
heapless = "0.9"
log = "0.4"
anyhow = "1"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
# Byte-blob fields in the inbound control mirror. Without it serde asks for a
# CBOR array of small integers where the wire carries a byte string.
serde_bytes = "0.11"
toml-cfg = "0.2"

[build-dependencies]
embuild = "0.33"
toml-cfg = "0.2"
