# Empty workspace table makes this a workspace root so cargo doesn't attach it
# to an unrelated Cargo.toml higher up the directory tree.
[workspace]

[package]
name = "opal-firmware"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.77"
description = "ESP32-S3 EMG wristband: dual ADS1298 acquisition, calibrated classification, feedback, and BLE HID"

# The default test harness stays on (the esp template disables it): `cargo
# test-device` runs the tests on the board via the espflash runner.
[[bin]]
name = "opal-firmware"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1
debug = true

[dependencies]
emg-runtime = { path = "../emg-runtime", default-features = false }
calibration-flow = { path = "../calibration-flow" }
feedback-vocabulary = { path = "../feedback-vocabulary" }
ble-media = { path = "../ble-media" }
protocol = { path = "../protocol" }
# Default features are the crate's own bench binary and its esp-idf-svc/log/anyhow
# dependencies; the driver itself is no_std over embedded-hal and wants none of them.
drv2605l = { path = "../drv2605l", default-features = false }
embedded-hal = "1"
esp-idf-svc = "0.52"
log = "0.4"
anyhow = "1"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
embuild = "0.33"
