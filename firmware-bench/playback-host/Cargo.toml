# The host end of the firmware validation bench: streams recorded sessions into
# a bare ESP32-S3 running `opal-firmware --features playback` and captures what
# comes back. Empty [workspace] per repo convention.
[workspace]

[package]
name = "playback-host"
version = "0.1.0"
edition = "2021"

[features]
clock-probe = []

[dependencies]
protocol = { path = "../../protocol" }
emg-runtime = { path = "../../emg-runtime" }
anyhow = "1"
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
