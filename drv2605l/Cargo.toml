# Empty workspace table makes this a workspace root so cargo doesn't attach it
# to an unrelated Cargo.toml higher up the directory tree.
[workspace]

[package]
name = "drv2605l"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.81"
description = "TI DRV2605L haptic driver over I2C, plus an ESP32-S3 bench example that plays a candidate set of wristband feedback patterns"

[lib]
name = "drv2605l"

[[example]]
name = "drv2605l-bench"
path = "examples/drv2605l-bench.rs"
required-features = ["bench"]

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1
debug = true

# `embedded-hal` is the only library dependency. Keeping esp-idf out of the lib is what
# lets opal-firmware take the driver later without inheriting this crate's bench setup.
[dependencies]
embedded-hal = "1"
esp-idf-svc = { version = "0.52", optional = true }
log = { version = "0.4", optional = true }
anyhow = { version = "1", optional = true }

[features]
default = ["bench"]
bench = ["dep:esp-idf-svc", "dep:log", "dep:anyhow"]

[build-dependencies]
# The espidf feature explicitly, because feature unification is not available
# here: when the firmware builds this crate something else in the graph turns
# it on, but a host consumer building the driver alone gets an `embuild` with
# no `espidf` module and a build script that will not compile. The script only
# calls into it under the bench feature, so a host build compiles it and never
# runs it.
embuild = { version = "0.33", features = ["espidf"] }
